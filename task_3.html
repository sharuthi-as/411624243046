<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message Manager</title>
    <link rel="stylesheet" href="task_3.css">
</head>
<body>

    <div class="container">

        <h1>Message Manager</h1>

        <input type="text" id="messageInput" placeholder="Enter your message">

        <div class="button-group">
            <button id="addBtn">Add Message</button>
            <button id="clearBtn">Clear All Messages</button>
        </div>

        <p id="count">Character Count: 0</p>

        <h3>Messages</h3>

        <div id="messageContainer"></div>

        <p id="status"></p>

    </div>

    <script src="task_3.js"></script>

</body>
</html>
